<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>UTM Link Builder - tagged campaign links with naming rules (offline)</title>
    <meta
      name="description"
      content="Build many UTM-tagged links at once with consistent naming, catch near-duplicate names, and export to CSV. Runs in your browser; nothing is uploaded."
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="container wide">
      <header class="site">
        <div>
          <h1>UTM Link Builder</h1>
          <p>Tag links the same way every time, so your reports line up.</p>
        </div>
        <span class="badge">Works offline - nothing leaves this device</span>
      </header>

      <section class="card" aria-labelledby="h-r">
        <h2 id="h-r">1. Naming rules</h2>
        <div class="grid">
          <div>
            <label class="inline"><input type="checkbox" id="lower" checked /> Make everything lower case</label>
          </div>
          <div>
            <label for="sep">Replace spaces with</label>
            <select id="sep">
              <option value="-">hyphen (-)</option>
              <option value="_">underscore (_)</option>
            </select>
          </div>
        </div>
        <label for="mediums">Allowed mediums (comma separated, leave empty to allow any)</label>
        <input type="text" id="mediums" />
      </section>

      <section class="card" aria-labelledby="h-l">
        <h2 id="h-l">2. Your links</h2>
        <label for="rows">One link per line: page address | source | medium | campaign | term (optional) | content (optional)</label>
        <textarea id="rows" rows="8"></textarea>
        <div class="row"><button id="demo" type="button">Load sample links</button><button id="clear" type="button">Clear</button></div>
      </section>

      <section class="card" aria-labelledby="h-o">
        <h2 id="h-o">3. Tagged links</h2>
        <ul id="audit" class="tips"></ul>
        <div class="table-wrap"><table id="t-out"></table></div>
        <p class="hint" id="empty" hidden>Add some links above.</p>
        <div class="row">
          <button class="primary" id="copy-all" type="button">Copy all links</button>
          <button id="csv" type="button">Download CSV</button>
          <button id="save" type="button">Save (.json)</button>
          <label class="file">Open saved list<input type="file" id="open-file" accept=".json,application/json" /></label>
        </div>
        <p class="status" id="out-status" role="status"></p>
      </section>

      <footer class="site"><a href="../../index.html">All tools</a> - MIT licensed</footer>
    </main>
    <script src="js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
